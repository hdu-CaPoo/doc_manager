<!DOCTYPE html>
<html>
<head>
    <title>验证码</title>
</head>
<body style="font-family: Arial, sans-serif;">
    <div style="padding: 20px; background-color: #f4f4f4;">
        <div style="max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px;">
            <h2>你好！</h2>
            <p>你正在进行 <strong>{{ project_name }}</strong> 的操作。</p>
            <p>你的验证码是：</p>
            <h1 style="color: #007bff; letter-spacing: 5px;">{{ code }}</h1>
            <p>该验证码将在 {{ valid_minutes }} 分钟后失效，请勿泄露给他人。</p>
            <hr>
            <p style="font-size: 12px; color: #888;">如果这不是你的操作，请忽略此邮件。</p>
        </div>
    </div>
</body>
</html>
